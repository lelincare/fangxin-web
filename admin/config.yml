backend:
  name: git-gateway
  branch: main

# 使用 Netlify Identity + Git Gateway 驗證身分,行政人員登入後才能編輯內容
# 部署後需在 Netlify 後台開啟 Identity 與 Git Gateway 功能(詳見 README.md)

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "zh_Hant"

collections:

  - name: "home"
    label: "首頁"
    files:
      - name: "home"
        label: "首頁內容"
        file: "content/home.json"
        fields:
          - { label: "主標題", name: "hero_title", widget: "string" }
          - { label: "標語", name: "hero_tagline", widget: "string" }
          - { label: "簡介文字", name: "hero_intro", widget: "text" }
          - { label: "服務地區標籤", name: "service_area_label", widget: "string" }
          - { label: "服務地區文字", name: "service_area_text", widget: "string" }
          - { label: "主要按鈕文字", name: "cta_primary_text", widget: "string" }
          - { label: "主要按鈕連結", name: "cta_primary_link", widget: "string" }
          - { label: "次要按鈕文字", name: "cta_secondary_text", widget: "string" }
          - { label: "次要按鈕連結", name: "cta_secondary_link", widget: "string" }
          - label: "三大服務卡片"
            name: "features"
            widget: "list"
            fields:
              - { label: "圖示 (emoji)", name: "icon", widget: "string" }
              - { label: "標題", name: "title", widget: "string" }
              - { label: "說明", name: "desc", widget: "text" }
              - { label: "連結", name: "link", widget: "string" }

  - name: "about"
    label: "關於我們"
    files:
      - name: "about"
        label: "關於我們內容"
        file: "content/about.json"
        fields:
          - { label: "沿革標題", name: "history_title", widget: "string" }
          - { label: "沿革內文", name: "history_text", widget: "text" }
          - { label: "理念標題", name: "mission_title", widget: "string" }
          - { label: "理念前言", name: "mission_intro", widget: "text" }
          - label: "理念三大重點"
            name: "mission_blocks"
            widget: "list"
            fields:
              - { label: "標題", name: "title", widget: "string" }
              - { label: "內文", name: "text", widget: "text" }
          - { label: "照片牆標題", name: "gallery_title", widget: "string" }
          - { label: "照片牆副標", name: "gallery_subtitle", widget: "string" }
          - label: "照片牆"
            name: "gallery"
            widget: "list"
            fields:
              - { label: "照片", name: "image", widget: "image" }
              - { label: "說明文字", name: "caption", widget: "string" }

  - name: "services"
    label: "服務項目"
    files:
      - name: "services"
        label: "服務項目內容"
        file: "content/services.json"
        fields:
          - { label: "居家照顧服務標題", name: "home_care_title", widget: "string" }
          - { label: "居家照顧服務副標", name: "home_care_subtitle", widget: "string" }
          - label: "居家照顧服務子項目"
            name: "home_care_items"
            widget: "list"
            fields:
              - { label: "標題", name: "title", widget: "string" }
              - { label: "說明", name: "text", widget: "text" }
          - { label: "喘息服務標題", name: "respite_title", widget: "string" }
          - label: "喘息服務子項目"
            name: "respite_items"
            widget: "list"
            fields:
              - { label: "標題", name: "title", widget: "string" }
              - { label: "說明", name: "text", widget: "text" }

  - name: "eligibility"
    label: "申請資格與補助"
    files:
      - name: "eligibility"
        label: "申請資格與補助內容"
        file: "content/eligibility.json"
        fields:
          - { label: "資格標題", name: "eligibility_title", widget: "string" }
          - { label: "資格前言", name: "eligibility_intro", widget: "text" }
          - label: "資格項目"
            name: "eligibility_items"
            widget: "list"
            fields:
              - { label: "文字", name: "text", widget: "string" }
              - { label: "提醒標籤(選填)", name: "alert", widget: "string", required: false }
          - { label: "補助標題", name: "subsidy_title", widget: "string" }
          - { label: "補助前言", name: "subsidy_intro", widget: "text" }
          - label: "補助比例表"
            name: "subsidy_rows"
            widget: "list"
            fields:
              - { label: "身分別", name: "category", widget: "string" }
              - { label: "補助比例", name: "percent", widget: "string" }
              - { label: "備註", name: "note", widget: "string" }

  - name: "resources"
    label: "教育資源"
    files:
      - name: "resources"
        label: "教育資源內容"
        file: "content/resources.json"
        fields:
          - { label: "影片區標題", name: "videos_title", widget: "string" }
          - { label: "影片區副標", name: "videos_subtitle", widget: "string" }
          - label: "衛教影片"
            name: "videos"
            widget: "list"
            fields:
              - { label: "標題", name: "title", widget: "string" }
              - { label: "YouTube 影片 ID", name: "youtube_id", widget: "string", hint: "例如網址 youtube.com/watch?v=ABC123 中的 ABC123" }
              - { label: "簡介", name: "description", widget: "text" }
          - { label: "文章區標題", name: "articles_title", widget: "string" }
          - label: "照顧小知識文章"
            name: "articles"
            widget: "list"
            fields:
              - { label: "標題", name: "title", widget: "string" }
              - { label: "內文", name: "content", widget: "text" }

  - name: "contact"
    label: "聯絡我們"
    files:
      - name: "contact"
        label: "聯絡我們內容"
        file: "content/contact.json"
        fields:
          - { label: "諮詢窗口標籤", name: "contact_name_label", widget: "string" }
          - { label: "諮詢窗口電話", name: "contact_phone", widget: "string" }
          - { label: "辦公室標籤", name: "office_label", widget: "string" }
          - { label: "辦公室電話", name: "office_phone", widget: "string" }
          - { label: "地址標籤", name: "address_label", widget: "string" }
          - { label: "地址", name: "address", widget: "string" }
          - { label: "地圖搜尋關鍵字", name: "map_query", widget: "string", hint: "用於 Google 地圖定位,通常與地址相同" }
