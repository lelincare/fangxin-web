<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聯絡我們｜芳心居家長照機構</title>
<meta name="description" content="芳心居家長照機構聯絡方式、機構地址與線上諮詢表單。">
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="brand">
      <img src="images/logo.png" alt="芳心居家長照機構 Logo">
      <span class="brand-text">芳心居家長照機構<span>交給芳心，家屬放心</span></span>
    </a>
    <button class="nav-toggle" aria-label="開啟選單">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">首頁</a></li>
      <li><a href="about.html">關於我們</a></li>
      <li><a href="services.html">服務項目</a></li>
      <li><a href="eligibility.html">申請資格與補助</a></li>
      <li><a href="resources.html">教育資源</a></li>
      <li><a href="contact.html">聯絡我們</a></li>
    </ul>
  </div>
</header>

<div class="container">
  <section class="section">
    <h1 class="section-title">📞 聯絡我們</h1>
    <p class="section-subtitle">歡迎來電諮詢，或透過表單留下您的需求，我們會盡快與您聯繫</p>

    <div class="contact-grid">

      <div class="reveal">
        <div class="card">
          <ul class="contact-info-list" id="contactInfoList"></ul>
        </div>
        <div class="map-embed">
          <iframe
            id="mapEmbed"
            src=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            title="芳心居家長照機構地圖位置">
          </iframe>
        </div>
      </div>

      <div class="card reveal">
        <h2 style="font-family:var(--font-display); color:var(--color-navy); margin-top:0;">線上諮詢表單</h2>

        <form id="contactForm" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="contact-form">
          <input type="hidden" name="form-name" value="contact" />
          <p style="display:none;">
            <label>如果您是人類請勿填寫此欄位：<input name="bot-field" /></label>
          </p>

          <div>
            <label for="name">姓名 *</label>
            <input type="text" id="name" name="name" required>
          </div>

          <div>
            <label for="phone">聯絡電話 *</label>
            <input type="tel" id="phone" name="phone" required>
          </div>

          <div>
            <label for="service">想諮詢的服務</label>
            <select id="service" name="service">
              <option value="居家照顧服務">居家照顧服務</option>
              <option value="居家喘息服務">居家喘息服務</option>
              <option value="申請資格與補助">申請資格與補助</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <div>
            <label for="message">想說的話</label>
            <textarea id="message" name="message" placeholder="請簡述長輩狀況或想了解的服務內容"></textarea>
          </div>

          <p class="form-note">送出表單即代表您同意我們透過留下的聯絡方式與您聯繫。</p>

          <button type="submit" class="btn btn-primary">送出諮詢</button>
        </form>

        <div id="formSuccess" class="form-success" style="display:none;">
          ✅ 已收到您的諮詢，我們會盡快與您聯繫，謝謝！
        </div>
      </div>

    </div>
  </section>
</div>

<footer class="site-footer">
  <p>© <span id="footerYear"></span> 芳心居家長照機構 All Rights Reserved.</p>
  <p>台南市佳里區中興街22號1F ｜ <a href="tel:0965833585">0965-833-585</a></p>
</footer>

<div class="bgm-player">
  <button id="bgmToggle" class="bgm-btn" aria-label="播放背景音樂">🎵</button>
  <audio id="bgmAudio" src="audio/bgm.mp3" loop preload="none"></audio>
</div>

<script src="js/main.js"></script>
<script>
async function renderContact() {
  const data = await loadJSON('content/contact.json');
  if (!data) return;

  document.getElementById('contactInfoList').innerHTML = `
    <li><span class="emoji">📞</span><span><strong>${data.contact_name_label}：</strong><br>
      <a href="tel:${data.contact_phone.replace(/-/g,'')}">${data.contact_phone}</a></span></li>
    <li><span class="emoji">☎</span><span><strong>${data.office_label}：</strong><br>
      <a href="tel:${data.office_phone.replace(/[()\s-]/g,'')}">${data.office_phone}</a></span></li>
    <li><span class="emoji">🏠</span><span><strong>${data.address_label}：</strong><br>
      <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.map_query)}" target="_blank" rel="noopener">${data.address}</a></span></li>
  `;

  document.getElementById('mapEmbed').src =
    `https://www.google.com/maps?q=${encodeURIComponent(data.map_query)}&output=embed`;
}
renderContact();

// ===== Netlify Forms 送出(AJAX,不離開頁面) =====
function encodeFormData(formData) {
  return new URLSearchParams(formData).toString();
}

document.getElementById('contactForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const form = e.target;
  const formData = new FormData(form);

  fetch('/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: encodeFormData(formData)
  })
    .then(() => {
      form.style.display = 'none';
      document.getElementById('formSuccess').style.display = 'block';
    })
    .catch(() => {
      alert('送出時發生問題，請直接來電聯繫我們，謝謝。');
    });
});
</script>
</body>
</html>
